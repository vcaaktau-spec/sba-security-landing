<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Страница не найдена | SBA Security</title>
  <meta name="description" content="Запрошенная страница не найдена. Вернитесь на главную SBA Security — видеонаблюдение, СКУД и охранные системы в Актау." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
      color: transparent;
      background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.2));
      -webkit-background-clip: text;
      background-clip: text;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 24px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(220,38,38,0.2);
      background: rgba(220,38,38,0.1);
      color: #ef4444;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    p {
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
      max-width: 380px;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #000;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
    }
    a:hover { background: #e5e5e5; }
  </style>
</head>
<body>
  <h1>404</h1>
  <div class="badge">Сигнал потерян</div>
  <p>Страница, которую вы ищете, была удалена или перемещена. Вернитесь на главную — там точно всё на месте.</p>
  <a href="/">На главную</a>
</body>
</html>
